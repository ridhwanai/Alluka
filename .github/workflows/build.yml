name: Build Alluka Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Build Alluka Manager APK
        run: |
          if [ -d "manager" ] && [ -f "manager/gradlew" ]; then
            cd manager
            chmod +x gradlew
            echo "==> Building Alluka Manager APK..."
            ./gradlew assembleDebug
            cd ..
          fi

      - name: Package KernelSU / APatch / Magisk Module
        run: |
          chmod +x scripts/package.sh
          bash scripts/package.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alluka-Module-v1.0
          path: dist/*

      - name: Send Release to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: "8856603947:AAEFyhBZR073avDNqbevF2pWl749S6Vjemw"
          TELEGRAM_CHAT_ID: "5313283857"
        run: |
          echo "Sending Alluka build artifacts to Telegram..."
          
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          
          MSG_TEXT="✨ <b>Alluka v1.0 Release Build Selesai!</b>%0A%0A📱 <b>Nama Aplikasi:</b> Alluka%0A🚀 <b>Branch:</b> ${GITHUB_REF_NAME}%0A🔗 <b>Commit:</b> <code>${COMMIT_HASH}</code> - ${COMMIT_MSG}%0A👤 <b>Maintainer:</b> @Alluka_id"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG_TEXT}" \
            -d "parse_mode=HTML" || true

          for zip_file in dist/*.zip; do
            if [ -f "$zip_file" ]; then
              echo "Uploading $zip_file to Telegram..."
              curl -s -F chat_id="${TELEGRAM_CHAT_ID}" \
                   -F document=@"$zip_file" \
                   -F caption="📦 <b>Alluka Module (KernelSU / APatch / Magisk)</b>%0AFile: $(basename "$zip_file")" \
                   -F parse_mode="HTML" \
                   "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
            fi
          done

          if [ -f "dist/Alluka.apk" ]; then
            echo "Uploading dist/Alluka.apk to Telegram..."
            curl -s -F chat_id="${TELEGRAM_CHAT_ID}" \
                 -F document=@"dist/Alluka.apk" \
                 -F caption="📱 <b>Alluka Manager Companion APK</b>%0AFile: Alluka.apk" \
                 -F parse_mode="HTML" \
                 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
          elif ls manager/app/build/outputs/apk/*/*.apk 1> /dev/null 2>&1; then
            FALLBACK_APK=$(ls manager/app/build/outputs/apk/*/*.apk | head -n 1)
            echo "Uploading fallback APK $FALLBACK_APK to Telegram..."
            curl -s -F chat_id="${TELEGRAM_CHAT_ID}" \
                 -F document=@"$FALLBACK_APK" \
                 -F caption="📱 <b>Alluka Manager Companion APK</b>%0AFile: $(basename "$FALLBACK_APK")" \
                 -F parse_mode="HTML" \
                 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
          fi
