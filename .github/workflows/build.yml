name: Build Alluka Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Alluka Manager APK
        run: |
          if [ -d "manager" ] && [ -f "manager/gradlew" ]; then
            cd manager
            chmod +x gradlew
            ./gradlew assembleRelease || ./gradlew assembleDebug
            cd ..
          else
            echo "Manager source not configured yet, continuing with module packaging"
          fi

      - name: Package KernelSU / APatch / Magisk Module
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alluka-Module-v1.0
          path: dist/*
